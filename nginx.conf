server {
    listen 80;
    server_name vod.bdiaby.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vod.bdiaby.fr;

    ssl_certificate /etc/letsencrypt/live/vod.bdiaby.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vod.bdiaby.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Upload de VOD : plusieurs gigaoctets, potentiellement des heures sur
        # une connexion montante lente. Les délais sont comptés entre deux
        # opérations et non sur la durée totale, mais on prend large.
        client_max_body_size 55G;
        client_body_timeout 600s;
        proxy_connect_timeout 75s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /queues {
        proxy_pass http://backend:3000/queues;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Les noms de ces fichiers contiennent une empreinte de leur contenu, donc
    # ils ne changent jamais sans changer de nom : on peut les garder longtemps.
    # Surtout, un fichier absent doit renvoyer 404 et non index.html. Sinon le
    # navigateur recoit du HTML la ou il attend du JavaScript, l import echoue
    # sans message clair, et la page ne finit jamais de charger.
    location ~* \.(js|css|map|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais venir du cache : apres un rebuild, les fichiers
    # JS changent de nom et un index perime reclame des morceaux disparus.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
